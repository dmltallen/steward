[project]
name = "steward"
version = "1.3.1"
description = "Steward: the personal AI you own, served on hardware you already have. Auto hardware detection and open-model selection."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "zeroconf>=0.131",
    "cryptography>=42",
]

[project.scripts]
steward = "steward.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
