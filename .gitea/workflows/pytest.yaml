name: Pytest
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  selector-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout
        run: |
          apt-get update -qq && apt-get install -y -qq git ca-certificates curl
          git clone --depth 1 "http://${{ secrets.GITEA_TOKEN }}@github.com/don/steward.git" .
          git log --oneline -1
      - name: Install uv
        run: pip install --quiet uv
      - name: Run selector and detect tests
        run: |
          set -o pipefail
          PYTHONPATH=src uv run --with pytest --with cryptography --no-project python -m pytest tests -q 2>&1 | tail -15
